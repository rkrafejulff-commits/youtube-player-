<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Embed Test</title>
<style>
body{margin:0;padding:16px;background:#111;color:#fff;font:16px Arial}
main{max-width:700px;margin:auto}
input{width:100%;padding:12px;box-sizing:border-box;border-radius:8px;border:1px solid #555;background:#222;color:white}
button{margin-top:10px;padding:12px 18px;border:0;border-radius:8px;background:#e11d48;color:white;font-weight:bold}
.player{margin-top:16px;width:100%;aspect-ratio:16/9;background:#000}
iframe{width:100%;height:100%;border:0}
p{color:#bbb;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main>
<h2>একটি YouTube ভিডিও পরীক্ষা</h2>
<p>লিংক আগে থেকেই বসানো আছে। Play চাপুন। এটি অবশ্যই HTTPS ওয়েবসাইটে (যেমন GitHub Pages) চালাতে হবে; ফোনে সরাসরি HTML ফাইল খুললে Error 153 হতে পারে।</p>
<input id="url" value="https://youtu.be/DHlA4jF69ic">
<button onclick="playVideo()">ভিডিও চালাও</button>
<div class="player" id="player"></div>
</main>
<script>
function getVideoId(value){
 try{
  const u=new URL(value.trim());
  const host=u.hostname.toLowerCase().replace(/^www\./,'');
  if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||'';
  if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host)){
   if(u.searchParams.get('v')) return u.searchParams.get('v');
   const p=u.pathname.split('/').filter(Boolean);
   if(['embed','shorts','live'].includes(p[0])) return p[1]||'';
  }
 }catch(e){}
 return '';
}
function playVideo(){
 const id=getVideoId(document.getElementById('url').value);
 if(!id){alert('সঠিক YouTube লিংক দিন');return;}
 document.getElementById('player').innerHTML='';
 const f=document.createElement('iframe');
 f.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0';
 f.title='YouTube video player';
 f.referrerPolicy='strict-origin-when-cross-origin';
 f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
 f.allowFullscreen=true;
 document.getElementById('player').appendChild(f);
}
playVideo();
</script>
</body>
</html>
